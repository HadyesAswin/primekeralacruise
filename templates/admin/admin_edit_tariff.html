<div class="container mt-4">
  <h1 class="h3 mb-4">Edit Tariff</h1>

  <form method="post" class="card shadow-sm p-4">
    {% csrf_token %}

    <!-- Category -->
    <div class="mb-3">
      <label for="id_category" class="form-label">Category</label>
      <select id="id_category" name="category" class="form-control" required>
        <option value="Deluxe" {% if tariff.category == "Deluxe" %}selected{% endif %}>Deluxe</option>
        <option value="Premium" {% if tariff.category == "Premium" %}selected{% endif %}>Premium</option>
        <option value="Luxury" {% if tariff.category == "Luxury" %}selected{% endif %}>Luxury</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="id_category" class="form-label">Type</label>
      <select id="id_category" name="type" class="form-control" required>
        <option value="DayCruise" {% if tariff.type == "DayCruise" %}selected{% endif %}>DayCruise</option>
        <option value="OvernightCruise" {% if tariff.type == "OvernightCruise" %}selected{% endif %}>OvernightCruise</option>

      </select>
    </div>

    <!-- Room Count -->
    <div class="mb-3">
      <label for="id_room_count" class="form-label">Room Count</label>
      <input type="text" id="id_room_count" name="room_count"
             class="form-control" maxlength="200"
             value="{{ tariff.room_count }}" required>
    </div>

    <!-- Amount -->
    <div class="mb-3">
      <label for="id_amount" class="form-label">Amount</label>
      <input type="text" id="id_amount" name="amount"
             class="form-control" maxlength="200"
             value="{{ tariff.amount }}" required>
    </div>

    <!-- Update Button -->
    <div class="text-center">
      <button type="submit" class="btn btn-warning">✏️ Update</button>
    </div>
  </form>
</div>

{% include 'admin/adminfooter.html' %} {% endcomment %}



{% include 'admin/adminheader.html' %}

<div class="container mt-4">
  <h1 class="h3 mb-4">Edit Tariff</h1>

  <form method="post" class="card shadow-sm p-4">
    {% csrf_token %}

    <!-- Category -->
    <div class="mb-3">
      <label class="form-label">Category</label>
      <select name="category" class="form-control" required>
        <option value="Deluxe" {% if tariff.category == "Deluxe" %}selected{% endif %}>Deluxe</option>
        <option value="Premium" {% if tariff.category == "Premium" %}selected{% endif %}>Premium</option>
        <option value="Luxury" {% if tariff.category == "Luxury" %}selected{% endif %}>Luxury</option>
      </select>
    </div>

    <!-- Type -->
    <div class="mb-3">
      <label class="form-label">Type</label>
      <select name="type" id="type" class="form-control" required onchange="toggleFields()">
        <option value="DayCruise" {% if tariff.type == "DayCruise" %}selected{% endif %}>DayCruise</option>
        <option value="OvernightCruise" {% if tariff.type == "OvernightCruise" %}selected{% endif %}>OvernightCruise</option>
      </select>
    </div>

    <!-- ====== DAY CRUISE FIELDS ====== -->
    <div id="day-fields" style="display:none;">
      <div class="mb-3">
        <label class="form-label">Base Amount</label>
        <input type="number" step="0.01" name="amount"
               class="form-control"
               value="{{ tariff.amount|default_if_none:'' }}"
               placeholder="Ex: 12000">
      </div>

      <div class="mb-3">
        <label class="form-label">Base People</label>
        <input type="number" name="base_people"
               class="form-control"
               value="{{ tariff.base_people|default_if_none:'' }}"
               placeholder="Ex: 5">
      </div>

      <div class="mb-3">
        <label class="form-label">Extra Person Charge</label>
        <input type="number" step="0.01" name="extra_person_amount"
               class="form-control"
               value="{{ tariff.extra_person_amount|default_if_none:'' }}"
               placeholder="Ex: 1000">
      </div>
    </div>

    <!-- ====== OVERNIGHT CRUISE FIELDS ====== -->
    <div id="night-fields" style="display:none;">
      <div class="mb-3">
        <label class="form-label">Room Count</label>
        <input type="number" name="room_count"
               class="form-control"
               value="{{ tariff.room_count|default_if_none:'' }}"
               placeholder="Ex: 1">
      </div>

      <div class="mb-3">
        <label class="form-label">Amount</label>
        <input type="number" step="0.01" name="amount_night"
               class="form-control"
               value="{{ tariff.amount|default_if_none:'' }}"
               placeholder="Ex: 15000">
      </div>

      <div class="mb-3">
        <label class="form-label">Extra Person Charge</label>
        <input type="number" step="0.01" name="extra_person_charge"
               class="form-control"
               value="{{ tariff.extra_person_charge|default_if_none:'' }}"
               placeholder="Ex: 1500">
      </div>

      <div class="mb-3">
        <label class="form-label">Note</label>
        <textarea name="note" class="form-control" rows="2"
                  placeholder="Ex: Each bedroom can accommodate 2 adults + 2 children below 5 years.">{{ tariff.note|default_if_none:'' }}</textarea>
      </div>
    </div>

    <!-- Submit Button -->
    <div class="text-center mt-4">
      <button type="submit" class="btn btn-warning">✏️ Update Tariff</button>
    </div>

  </form>
</div>

<script>
function toggleFields() {
  const type = document.getElementById('type').value;
  const dayFields = document.getElementById('day-fields');
  const nightFields = document.getElementById('night-fields');

  if (type === 'DayCruise') {
    dayFields.style.display = 'block';
    nightFields.style.display = 'none';
  } else if (type === 'OvernightCruise') {
    nightFields.style.display = 'block';
    dayFields.style.display = 'none';
  } else {
    dayFields.style.display = 'none';
    nightFields.style.display = 'none';
  }
}

// ✅ Ensure correct section visible on load
document.addEventListener('DOMContentLoaded', toggleFields);
</script>

{% include 'admin/adminfooter.html' %}
