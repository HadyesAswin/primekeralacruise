{% extends 'public/home2.html' %}
{% load static %}
{% block title %} BookNow {% endblock %}

<style>
    .card button:hover {
        background-color: #3C8529 !important;
        box-shadow: 0px 4px 16px rgba(77, 162, 53, 0.4);
    }
    .form-control:focus {
        border-color: #4DA235 !important;
        box-shadow: 0 0 6px rgba(77, 162, 53, 0.3) !important;
    }
</style>

<main id="main">
{% block content %}

<section class="breadcumb-section" style="background-image: url('{% static "assets/images/contactusbanner.jpg" %}');">
    <div class="tf-container">
        <div class="row">
            <div class="col-lg-12 center z-index1">
                <h1 class="title" style="font-family:Bricolage Grotesque, sans-serif;">Book Now</h1>
                <ul class="breadcumb-list flex-five">
                    <li><a href="./" style="font-family:Bricolage Grotesque, sans-serif;">Home</a></li>
                    <li><span style="font-family:Bricolage Grotesque, sans-serif;">Book Now</span></li>
                </ul>
                <img class="bcrumb-ab" src={% static "assets/images/page/mask-bcrumb.png" %} alt="">
            </div>
        </div>
    </div>
</section>

<section class="d-flex justify-content-center align-items-center mt-5 mb-5">
    <div class="card p-4 px-5" 
        style="max-width: 550px; width: 100%; border-radius: 18px; border: none;
        box-shadow: 0px 4px 20px rgba(0,0,0,0.08);">

        <h3 class="mb-4 text-center" 
            style="color: #4DA235; font-weight: 600; font-family: 'Bricolage Grotesque', sans-serif;">
            Book Your Trip
        </h3>

        <form method="POST" style="font-family: 'Bricolage Grotesque', sans-serif;">
            {% csrf_token %}

            {% if request.GET.item %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Booking Item</label>
                <input type="text" name="booking_item" class="form-control"
                    value="{% if request.GET.category %}{{ request.GET.category }}, {{ request.GET.item }}{% else %}{{ request.GET.item }}{% endif %}"
                    readonly
                    style="background-color: #f8f8f8; border-radius: 10px;">
            </div>
            {% endif %}

            <!-- {% if request.GET.price %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Price</label>
                <input type="text" name="price" class="form-control"
                    value="{{ request.GET.price }}"
                    readonly
                    id="priceField"
                    style="background-color: #f8f8f8; border-radius: 10px;">
            </div>

            
            <div class="mb-3">
                <label class="form-label fw-semibold">Advance Amount (20%)</label>
                <input type="text" name="advance_amount" class="form-control"
                    id="advanceAmount"
                    readonly
                    style="background-color: #f8f8f8; border-radius: 10px;">
            </div>
            {% endif %} -->

            <!-- Full Name -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Full Name</label>
                <input type="text" name="fullname" class="form-control" required>
            </div>

            <!-- Place -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Place</label>
                <input type="text" name="place" class="form-control" required>
            </div>

            <!-- Dates -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Date</label>
                    <input type="date" name="from_date" class="form-control" required>
                </div>
            </div>

            <!-- Phone -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Phone Number</label>
                <input type="tel" name="phone" class="form-control" maxlength="10" required>
            </div>

            <!-- Email -->
            <div class="mb-4">
                <label class="form-label fw-semibold">Email Address</label>
                <input type="email" name="email" class="form-control" required>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn w-100 fw-semibold"
                style="background-color: #4DA235; color: #fff; border-radius: 12px; padding: 12px 0;
                font-size: 17px; transition: 0.3s;">
                Submit Booking
            </button>
        </form>
    </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const fromDate = document.querySelector('input[name="from_date"]');
    const priceField = document.getElementById("priceField");
    const advanceField = document.getElementById("advanceAmount");

    // ✅ Date validation logic
    const today = new Date().toISOString().split("T")[0];
    fromDate.setAttribute("min", today);

    // ✅ Advance amount calculation (20% of price)
    if (priceField && advanceField) {
        // Remove non-numeric characters like ₹, commas, or spaces
        let cleanPrice = priceField.value.replace(/[^\d.]/g, '');
        let price = parseFloat(cleanPrice);

        if (!isNaN(price)) {
            let advance = (price * 0.20).toFixed(2);
            // Format number with commas
            advanceField.value = "₹" + Number(advance).toLocaleString("en-IN");
        } else {
            advanceField.value = "Invalid Price";
        }
    }
});
</script>

{% endblock %}
</main>
