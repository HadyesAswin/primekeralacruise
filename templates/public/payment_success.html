<!DOCTYPE html>
<html>
<head>
    <title>Payment Successful</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: rgba(0,0,0,0.3);
            margin: 0;
            padding: 0;
        }

        /* Popup overlay */
        .popup-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        /* Popup card */
        .popup-card {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 420px;
            padding: 30px 25px;
            text-align: center;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        /* Close button */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: transparent;
            border: none;
            font-size: 24px;
            color: #555;
            cursor: pointer;
        }

        h2 {
            color: #4DA235;
            font-weight: 600;
            margin-bottom: 15px;
        }

        p {
            color: #333;
            font-size: 15px;
            margin: 8px 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="popup-overlay" id="successPopup">
        <div class="popup-card">
            <button class="close-btn" onclick="closePopup()">×</button>
            <h2>Payment Successful!</h2>
            <p>Thank you {{ booking.fullname }}. Your payment of ₹{{ booking.amount }} has been received.</p>
            <p>Payment ID: {{ booking.payment_id }}</p>
            <p>Order ID: {{ booking.order_id }}</p>
            <p>An email has been sent to {{ booking.email }} and admin.</p>
        </div>
    </div>

    <script>
        function closePopup() {
            // Hide popup
            document.getElementById('successPopup').style.display = 'none';
            // Redirect to allpackages page
            window.location.href = "{% url 'allpackages' %}";
        }

        // Auto open popup on page load
        window.onload = function() {
            document.getElementById('successPopup').style.display = 'flex';
        };
    </script>
</body>
</html>
